<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El cuarto de Mimi</title>
<meta name="theme-color" content="#FFE3F1"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Valentina">
<link rel="icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="comun.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Mimi's room: its own page so the phone frees all of this when Valentina goes back to the castle. */
/* Mimi room */
.room{position:relative;margin-top:14px;border-radius:32px;overflow:hidden;border:5px solid #fff;box-shadow:0 10px 0 var(--line),0 18px 30px #4A236122;
  aspect-ratio:10/11;max-width:100%;
  background:
    radial-gradient(circle at 12px 12px,#ffffff80 0 3px,transparent 4px) 0 0/34px 34px,
    linear-gradient(180deg,#D9C6FF,#F6DDF6 70%)}
.room .wall-stripe{position:absolute;left:0;right:0;top:58%;height:5%;background:#fff;opacity:.6}
.room .win{position:absolute;left:6%;top:7%;width:30%;aspect-ratio:1;border-radius:46% 46% 10px 10px;border:6px solid #fff;overflow:hidden;
  background:radial-gradient(circle at 70% 30%,#FFF6C9 0 12%,transparent 13%),radial-gradient(circle at 25% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 55% 75%,#fff 0 2px,transparent 3px),radial-gradient(circle at 35% 25%,#fff 0 1.5px,transparent 2.5px),linear-gradient(180deg,#5B4BB5,#9E7CE8)}
.room .win::before,.room .win::after{content:"";position:absolute;background:#fff}
.room .win::before{left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px}.room .win::after{top:50%;left:0;right:0;height:5px;margin-top:-2.5px}
.room .shelf{position:absolute;right:6%;top:18%;width:32%;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(1.3rem,6vw,2rem);line-height:1;
  border-bottom:8px solid #E0AE7E;border-radius:2px;padding-bottom:2px}
.room .garland{position:absolute;left:0;right:0;top:0;height:30px;display:flex;justify-content:space-around;pointer-events:none}
.room .garland i{width:22px;height:26px;clip-path:polygon(0 0,100% 0,50% 100%);background:var(--c)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#F4CFA6 0 54px,#E9BD90 54px 57px);border-top:7px solid #E3AF80}
.room .rug{position:absolute;left:10%;right:10%;bottom:5%;height:17%;border-radius:50%;
  background:radial-gradient(ellipse at center,#FFB8DA 0 38%,#fff 39% 43%,#FF9CCB 44% 100%);box-shadow:0 0 0 5px #fff}
.room .notes{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.room .notes span{position:absolute;bottom:30%;font-size:1.8rem;animation:float 2.4s ease-out forwards}
@keyframes float{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-220px) scale(1.2) rotate(20deg);opacity:0}}
.room.party::after{content:"";position:absolute;left:-25%;top:-25%;width:150%;height:150%;pointer-events:none;z-index:1;opacity:.35;will-change:transform;
  background:conic-gradient(#FF4FA0,#FFC22E,#2FC4A4,#5BB8F5,#A77BFF,#FF4FA0);animation:spin360 3s linear infinite}
.mimi-wrap{position:absolute;left:50%;bottom:4%;width:62%;transform:translateX(-50%);z-index:2}
.room .notes span{will-change:transform,opacity}
#mimiSays{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:4;background:#fff;border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:800;font-size:1.05rem;
  box-shadow:0 5px 0 var(--line);white-space:nowrap}
#mimiBig{display:block;width:100%;touch-action:manipulation;padding:0;transform-origin:50% 100%;will-change:transform;animation:breathe 3.4s ease-in-out infinite}
#mimiBig .tail{transform-box:fill-box;transform-origin:0% 90%}
#mimiBig.wag .tail{animation:tail .8s ease-in-out 2}
@keyframes tail{50%{transform:rotate(12deg)}}
#mimiBig #mHead,#mimiBig #mBody,#mimiBig #mPawL,#mimiBig #mPawR{transform-box:fill-box}
#mimiBig #mHead{transform-origin:50% 92%}#mimiBig #mBody{transform-origin:50% 100%}
#mimiBig #mPawL{transform-origin:80% 10%}#mimiBig #mPawR{transform-origin:20% 10%}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
#mimiBig .mouth-open{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0)}
#mimiBig .happy-eyes,#mimiBig .wow-eyes{opacity:0}
#mimiBig.happy .eyes,#mimiBig.wow .eyes{opacity:0}
#mimiBig.happy .happy-eyes{opacity:1}#mimiBig.wow .wow-eyes{opacity:1}
#mimiBig.jump{animation:jump .7s}
@keyframes jump{30%{transform:translateY(-16%) scaleY(1.04)}60%{transform:translateY(0) scaleY(.94)}}
#mimiBig.spin{animation:spin360 .85s ease-in-out}
@keyframes spin360{to{transform:rotate(360deg)}}
#mimiBig.wig #mHead,#mimiBig.listen #mHead{animation:headwig .9s ease-in-out}
#mimiBig.listen #mHead{animation-duration:2s;animation-iteration-count:infinite}
@keyframes headwig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#mimiBig.pose{animation:pose .9s}
@keyframes pose{30%{transform:scale(1.08) rotate(-4deg)}60%{transform:scale(1.04) rotate(4deg)}}
#mimiBig.pose #mPawR{animation:pawR .45s 2}
#mimiBig.dance{animation:hop .44s ease-in-out infinite}
#mimiBig.dance #mBody{animation:sway .88s ease-in-out infinite}
#mimiBig.dance #mHead{animation:headwig .88s ease-in-out infinite}
#mimiBig.dance #mPawL{animation:pawL .44s ease-in-out infinite}
#mimiBig.dance #mPawR{animation:pawR .44s ease-in-out infinite}
#mimiBig.dance .tail{animation-duration:.44s}
@keyframes hop{50%{transform:translateY(-6%)}}
@keyframes sway{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pawL{50%{transform:rotate(70deg)}}
@keyframes pawR{50%{transform:rotate(-70deg)}}
#mimiBig.talk{animation:hop .34s ease-in-out infinite}
#mimiBig.chomp .mouth-open{animation:chomp .3s ease-in-out 6}
@keyframes chomp{50%{transform:scaleY(1)}}
.room-ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px;justify-items:center}
.big-btn{width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;color:#fff;font-family:var(--display);font-weight:800;
  font-size:clamp(.82rem,3.6vw,1.05rem);background:var(--c,var(--rose));box-shadow:0 7px 0 var(--cd,var(--rose-d));position:relative;line-height:1;text-align:center}
.big-btn b{font-size:clamp(1.8rem,8vw,2.6rem);line-height:1}
.big-btn:active{transform:translateY(6px);box-shadow:none}
.big-btn.rec{--c:var(--mint);--cd:var(--mint-d)}
.big-btn.rec::after,.big-btn.main::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:5px solid var(--c,var(--rose));animation:ring 1.4s infinite;will-change:transform,opacity}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.22);opacity:0}}
#playBack{display:block;margin:14px auto 0}
.dress{background:var(--card);border-radius:24px;padding:12px;margin-top:16px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px}
.dress-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dress-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 2px 8px}
.dress-tabs::-webkit-scrollbar{display:none}
.dtab{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:72px;padding:6px 8px;border-radius:16px;background:var(--soft);font-weight:900;font-size:.75rem;color:var(--ink-soft);border:3px solid transparent}
.dtab b{font-size:1.5rem;line-height:1.1}
.dtab.on{background:#FFE3F1;border-color:var(--rose);color:var(--ink)}
.swatch.none{font-size:1.3rem;opacity:.75}
#surpriseBtn{font-size:1.1rem;padding:11px}
.swatch{width:58px;height:58px;border-radius:50%;font-size:1.7rem;display:grid;place-items:center;background:var(--soft);border:3px solid var(--line)}
.swatch.on{border-color:var(--rose);background:#FFE3F1;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--rose)}
.swatch.fur{background:linear-gradient(135deg,var(--sw) 0 60%,var(--sw2) 60%)}
.room-note{font-size:.85rem;font-weight:800;color:var(--ink-soft);text-align:center;margin:14px auto 0;max-width:470px;line-height:1.45}
#audioIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#mimiBig.sleep{animation:breathe 2.6s ease-in-out infinite}
#mimiBig.sleep .eyes{opacity:0}#mimiBig.sleep .happy-eyes{opacity:1}
#wake{background:#4A236155;align-items:end;padding-bottom:max(28px,env(safe-area-inset-bottom,0px))}
.wake-card{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border-radius:28px;padding:16px 26px;box-shadow:0 8px 0 var(--line);animation:pop .5s;max-width:100%}
.wake-card b{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--rose);line-height:1.05}
.wake-card span{font-weight:800;color:var(--ink-soft)}
.wake-card .zzz{font-size:2.6rem;animation:idle 2s ease-in-out infinite}

</style>
</head><body>
<main class="wrap">
  <!-- MIMI ROOM -->
  <section id="mimi">
    <div class="bar">
      <button class="pill" id="mimiBack">🏰 Volver</button>
      <span class="pill">🐱 El cuarto de Mimi</span>
    </div>
    <div class="room" id="room">
      <div class="garland"><i style="--c:#FF6F91"></i><i style="--c:#FFC22E"></i><i style="--c:#2FC4A4"></i><i style="--c:#5BB8F5"></i><i style="--c:#A77BFF"></i><i style="--c:#FF6F91"></i><i style="--c:#FFC22E"></i></div>
      <div class="win"></div>
      <div class="shelf"><span>🧸</span><span>🌷</span><span>🧶</span></div>
      <div class="wall-stripe"></div>
      <div class="floor"></div><div class="rug"></div>
      <div class="notes" id="notes"></div>
      <span id="mimiSays" hidden></span>
      <div class="mimi-wrap"><button id="mimiBig" aria-label="Tocar a Mimi"></button></div>
    </div>
    <button class="btn" id="playBack" hidden>▶️ ¡Escucha a Mimi!</button>
    <div class="room-ctrl">
      <button class="big-btn main" id="talkBtn" hidden><b>🎤</b>Háblale</button>
      <label class="big-btn main btnlike" id="talkLabel" for="audioIn"><b>🎤</b>Grábate</label>
      <input type="file" id="audioIn" accept="audio/*">
      <button class="big-btn" id="feedBtn" style="--c:var(--peach);--cd:var(--peach-d)"><b>🐟</b>Comida</button>
      <button class="big-btn" id="danceBtn" style="--c:var(--lilac);--cd:var(--lilac-d)"><b>💃</b>Bailar</button>
      <button class="big-btn" id="dressBtn" style="--c:var(--mint);--cd:var(--mint-d)"><b>👗</b>Vestir</button>
    </div>
    <div class="dress" id="dress" hidden>
      <div class="dress-tabs" id="dressTabs"></div>
      <div class="dress-row" id="dressItems"></div>
      <button class="btn gold" id="surpriseBtn">🎲 ¡Sorpréndeme!</button>
    </div>
    <p class="room-note" id="roomNote"></p>
    <p class="room-note">Toca a Mimi en la cabeza, la barriga, la cola o el cascabel: cada parte reacciona distinto.</p>
  </section>
</main>
<div class="overlay" id="wake"><button class="wake-card" id="wakeBtn"><span class="zzz">💤</span><b>Mimi está durmiendo</b><span>Toca para despertarla</span></button></div>
<canvas id="fx"></canvas>
<script src="voz/textos.js"></script>
<script src="comun.js"></script>
<script>
const ACC = {
  bow: bowSVG(VARF),
  crown: `<g transform="translate(120 42)"><path d="M-30 0 L-34 -30 L-16 -14 L0 -36 L16 -14 L34 -30 L30 0 Z" fill="#FFC22E" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><circle cx="0" cy="-12" r="5" fill="#FF4FA0" stroke="${INK}" stroke-width="2"/><circle cx="-18" cy="-6" r="3.5" fill="#2FC4A4"/><circle cx="18" cy="-6" r="3.5" fill="#A77BFF"/></g>`,
  flower: [[66, 62, '#FF6F91'], [90, 47, '#FFA552'], [120, 41, '#B48CFF'], [150, 47, '#62B6FF'], [174, 62, '#FF6F91']].map(([x, y, c]) =>
    `<g transform="translate(${x} ${y})" stroke="${INK}" stroke-width="2"><circle cy="-7" r="6.5" fill="${c}"/><circle cx="7" cy="-1" r="6.5" fill="${c}"/><circle cx="4" cy="7" r="6.5" fill="${c}"/><circle cx="-4" cy="7" r="6.5" fill="${c}"/><circle cx="-7" cy="-1" r="6.5" fill="${c}"/><circle r="4.5" fill="#FFD84D"/></g>`).join(''),
  hat: `<g transform="translate(100 44) rotate(-16)"><path d="M-22 0 L0 -58 L22 0 Z" fill="#62B6FF" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M-13 -22 L13 -22 M-17 -10 L17 -10" stroke="#fff" stroke-width="5"/><circle cy="-60" r="8" fill="#FFC22E" stroke="${INK}" stroke-width="3"/></g>`,
  glasses: `<g stroke="${INK}" stroke-width="3" stroke-linejoin="round"><path d="M86 128 C58 112 62 86 86 100 C110 86 114 112 86 128Z" fill="#FF4FA0" fill-opacity=".9"/><path d="M154 128 C126 112 130 86 154 100 C178 86 182 112 154 128Z" fill="#FF4FA0" fill-opacity=".9"/><path d="M106 104 Q120 96 134 104" fill="none"/><path d="M75 100 l6 -4" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M143 100 l6 -4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>`
};
const TOP_ACC = ['crown', 'flower', 'hat'];

const MIMI_BIG = `<svg viewBox="0 -40 240 330" aria-hidden="true">
  <ellipse cx="120" cy="284" rx="78" ry="9" fill="#4A23611f"/>
  <g class="tail"><path d="M168 250 C224 252 238 200 216 166 C206 148 186 152 192 168" fill="none" stroke="${INK}" stroke-width="27" stroke-linecap="round"/>
    <path d="M168 250 C224 252 238 200 216 166 C206 148 186 152 192 168" fill="none" style="stroke:var(--fur)" stroke-width="19" stroke-linecap="round"/>

  <g class="slot-back"></g>

    <path d="M120 150 C164 150 184 192 182 232 C180 264 158 276 120 276 C82 276 60 264 58 232 C56 192 76 150 120 150 Z" ${sf(VARF.fur)} stroke="${INK}" stroke-width="4"/>
    <ellipse cx="120" cy="232" rx="35" ry="37" ${sf(VARF.belly)}/>
    <g class="slot-outfit"></g>
    <ellipse cx="93" cy="276" rx="23" ry="12" ${sf(VARF.fur)} stroke="${INK}" stroke-width="4"/><ellipse cx="147" cy="276" rx="23" ry="12" ${sf(VARF.fur)} stroke="${INK}" stroke-width="4"/>
    <g fill="#FF9CCB"><circle cx="85" cy="274" r="3.2"/><circle cx="93" cy="270" r="3.2"/><circle cx="101" cy="274" r="3.2"/><circle cx="139" cy="274" r="3.2"/><circle cx="147" cy="270" r="3.2"/><circle cx="155" cy="274" r="3.2"/></g>

  <g id="mPawL"><g transform="rotate(24 72 214)"><ellipse cx="72" cy="214" rx="15" ry="30" ${sf(VARF.fur)} stroke="${INK}" stroke-width="4"/><ellipse cx="72" cy="236" rx="7" ry="5" fill="#FF9CCB"/></g></g>
  <g id="mPawR"><g transform="rotate(-24 168 214)"><ellipse cx="168" cy="214" rx="15" ry="30" ${sf(VARF.fur)} stroke="${INK}" stroke-width="4"/><ellipse cx="168" cy="236" rx="7" ry="5" fill="#FF9CCB"/><g class="slot-hand"></g></g></g>
  <g id="mHead">${kittyHead(VARF, true)}
    <g class="slot-eyes"></g><g class="slot-bow"></g><g class="slot-head"></g>
  </g>
</svg>`;
/* Mimi's wardrobe: every item is drawn on the big Mimi's own coordinates. One item per category. */
const K = INK;
const star5 = (x, y, r, fill) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ' ' + (y + rr * Math.sin(a)).toFixed(1); } return `<path d="${d}Z" fill="${fill}" stroke="${K}" stroke-width="2.2" stroke-linejoin="round"/>`; };
const flower = (x, y, c, r = 6) => `<g transform="translate(${x} ${y})" stroke="${K}" stroke-width="1.8"><circle cy="${-r}" r="${r}" fill="${c}"/><circle cx="${r}" cy="${-r * .2}" r="${r}" fill="${c}"/><circle cx="${r * .6}" cy="${r}" r="${r}" fill="${c}"/><circle cx="${-r * .6}" cy="${r}" r="${r}" fill="${c}"/><circle cx="${-r}" cy="${-r * .2}" r="${r}" fill="${c}"/><circle r="${r * .7}" fill="#FFD84D"/></g>`;
const emo = (e, x = 176, y = 246, s = 58) => `<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="middle">${e}</text>`;
const NECKLINE = 'M82 182 Q120 198 158 182';

const WARDROBE = {
  outfit: { label: 'Ropa', icon: '👗', items: {
    princesa: { icon: '👗', name: 'Princesa', svg: `<circle cx="82" cy="192" r="13" fill="#FF8CC6" stroke="${K}" stroke-width="3"/><circle cx="158" cy="192" r="13" fill="#FF8CC6" stroke="${K}" stroke-width="3"/>
      <path d="M80 184 Q120 200 160 184 L166 216 Q120 226 74 216 Z" fill="#FF4FA0" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M74 214 Q120 226 166 214 L190 260 Q154 274 120 272 Q86 274 50 260 Z" fill="#FF9CCB" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M58 258 q8 7 16 0 q8 7 16 0 q8 7 16 0 q8 7 16 0 q8 7 16 0 q8 7 16 0 q8 7 16 0 q8 7 16 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M74 215 Q120 228 166 215" fill="none" stroke="#FFC22E" stroke-width="6"/>
      <g fill="#fff"><circle cx="96" cy="238" r="3"/><circle cx="142" cy="242" r="3"/><circle cx="118" cy="252" r="2.5"/><circle cx="162" cy="234" r="2.5"/><circle cx="80" cy="246" r="2.5"/></g>${star5(120, 200, 7, '#FFE27A')}` },
    bailarina: { icon: '🩰', name: 'Bailarina', svg: `<path d="M84 182 Q120 198 156 182 L164 228 Q120 238 76 228 Z" fill="#D9C4FF" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M62 222 L46 246 L66 240 L62 258 L82 244 L84 262 L100 246 L108 264 L120 248 L132 264 L140 246 L156 262 L158 244 L178 258 L174 240 L194 246 L178 222 Q120 238 62 222Z" fill="#FFB8E6" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M70 226 L62 240 L78 236 L80 250 L96 238 L104 252 L120 240 L136 252 L144 238 L160 250 L162 236 L178 240 L170 226 Q120 240 70 226Z" fill="#FFD6F1"/>${flower(120, 206, '#FF6F91', 5)}` },
    heroina: { icon: '🦸', name: 'Superheroína', back: `<path d="M84 178 Q26 238 40 286 L200 286 Q214 238 156 178 Z" fill="#FF5C7A" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>`,
      svg: `<path d="M82 182 Q120 198 158 182 L168 236 Q120 248 72 236 Z" fill="#5BB8F5" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M72 232 Q120 246 168 232" fill="none" stroke="#FFC22E" stroke-width="7"/>${star5(120, 212, 15, '#FFC22E')}
      <circle cx="86" cy="186" r="6" fill="#FFC22E" stroke="${K}" stroke-width="2"/><circle cx="154" cy="186" r="6" fill="#FFC22E" stroke="${K}" stroke-width="2"/>` },
    hada: { icon: '🧚', name: 'Hada', back: `<g stroke="${K}" stroke-width="3" fill="#BFF3E4" fill-opacity=".9"><ellipse cx="60" cy="182" rx="38" ry="24" transform="rotate(-32 60 182)"/><ellipse cx="180" cy="182" rx="38" ry="24" transform="rotate(32 180 182)"/><ellipse cx="62" cy="228" rx="26" ry="16" transform="rotate(22 62 228)"/><ellipse cx="178" cy="228" rx="26" ry="16" transform="rotate(-22 178 228)"/></g>
      <g fill="#fff"><circle cx="50" cy="176" r="3"/><circle cx="190" cy="176" r="3"/><circle cx="64" cy="226" r="2.5"/><circle cx="176" cy="226" r="2.5"/></g>`,
      svg: `<path d="M84 182 Q120 198 156 182 L178 252 L164 246 L158 264 L144 252 L132 268 L120 254 L108 268 L96 252 L82 264 L76 246 L62 252 Z" fill="#6FE0C6" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>
      <g fill="#fff"><circle cx="100" cy="222" r="3"/><circle cx="138" cy="230" r="3"/><circle cx="120" cy="244" r="2.5"/></g>${flower(120, 200, '#FF9CCB', 5)}` },
    pijama: { icon: '🌙', name: 'Pijama', svg: `<path d="M80 182 Q120 198 160 182 Q184 210 182 240 Q180 270 120 272 Q60 270 58 240 Q56 210 80 182Z" fill="#9EC9FF" stroke="${K}" stroke-width="3.5"/>

(function migrateMimi(){

  if (m.acc) { d.head = a.crown ? 'corona' : a.flower ? 'flores' : a.hat ? 'fiesta' : null; d.bow = a.bow ? 'rosa' : null; d.eyes = a.glasses ? 'corazones' : null; }

function applyMimiLook(){
  const m = $('#mimiBig'), F = FURS[store.mimi.fur] || FURS[0];
  ['fur', 'fur2', 'stripe', 'belly'].forEach(k => m.style.setProperty('--' + k, F[k]));
  const it = (cat) => store.mimi[cat] && WARDROBE[cat].items[store.mimi[cat]];
  const o = it('outfit');
  m.querySelector('.slot-back').innerHTML = (o && o.back) || '';
  m.querySelector('.slot-outfit').innerHTML = (o && o.svg) || '';
  ['head', 'eyes', 'neck', 'hand'].forEach(c => { const x = it(c); m.querySelector('.slot-' + c).innerHTML = x ? x.svg : ''; });

    return `<button class="dtab ${t === dressTab ? 'on' : ''}" data-tab="${t}"><b>${lab[0]}</b>${lab[1]}</button>`;
  }).join('');

  if (dressTab === 'fur') html = FURS.map((f, i) => `<button class="swatch fur ${store.mimi.fur === i ? 'on' : ''}" data-fur="${i}" aria-label="Gatita ${f.label}" style="--sw:${f.fur};--sw2:${f.stripe}"></button>`).join('');

      Object.entries(cat.items).map(([k, x]) => x.color
        ? `<button class="swatch fur ${cur === k ? 'on' : ''}" data-cat="${dressTab}" data-item="${k}" aria-label="Moño ${x.name}" style="--sw:${x.color};--sw2:${x.color}">🎀</button>`

function mimiAnim(cls, ms){ const m = $('#mimiBig'); m.classList.remove('jump', 'spin', 'wig', 'pose'); void m.getBoundingClientRect(); m.classList.add(cls); setTimeout(() => m.classList.remove(cls), ms); }

function spawnNote(ch, n = 1){ for (let i = 0; i < n; i++) setTimeout(() => { const s = document.createElement('span'); s.textContent = ch; s.style.left = (22 + Math.random() * 56) + '%'; $('#notes').appendChild(s); setTimeout(() => s.remove(), 2500); }, i * 140); }
function setBubble(t){ const b = $('#mimiSays'); b.textContent = t || ''; b.hidden = !t; }

function purr(){
  if (!store.sound) return;
  try {
    ensureAc(); const t = ac.currentTime;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55; f.type = 'lowpass'; f.frequency.value = 380;
    lfo.frequency.value = 24; lg.gain.value = .12; lfo.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .15); g.gain.setValueAtTime(.16, t + 1.1); g.gain.linearRampToValueAtTime(0, t + 1.4);
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); lfo.start(t); o.stop(t + 1.5); lfo.stop(t + 1.5);
  } catch (e) {}
}
function giggle(){ [880, 1046, 932, 1175, 1046].forEach((f, i) => tone(f, i * .08, .1, 'triangle', .07)); }
function bell(){ tone(1568, 0, .5, 'sine', .08); tone(2093, .02, .4, 'sine', .05); }

function wakeMimi(){
  $('#wake').hidden = true; unlockAudio(); prefetchVoice('mimi_intro', 'mimi_pet', 'mimi_tickle1', 'mimi_yum');
  const m = $('#mimiBig'); m.classList.remove('sleep');
  mood('wow', 900); mimiAnim('jump', 700); meow(); spawnNote('✨', 3);
  setTimeout(() => sayMimi('mimi_intro'), 600);
  setMicMode(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) && !micBlocked);
}
let micBlocked = false;
function setMicMode(live){
  $('#talkBtn').hidden = !live; $('#talkLabel').hidden = live;
  $('#roomNote').innerHTML = live
    ? 'Toca <b>Háblale</b> y di algo. Cuando Valentina termina de hablar, Mimi lo repite con su voz chistosa. La primera vez, el celular pide permiso para usar el micrófono: toca «Permitir». Nada se guarda ni se envía.'
    : 'Toca <b>Grábate</b> y elige la grabadora de voz del celular. Graba lo que quieras decirle a Mimi y acepta: Mimi lo repite con su voz chistosa. La grabación no se guarda ni se envía.';
}
async function initMic(){
  if (micStream && micStream.active) return true;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return false;
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    return true;
  } catch (e) { micStream = null; return false; }
}
function closeMic(){
  try { micStream && micStream.getTracks().forEach(t => t.stop()); } catch (e) {} micStream = null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
}
function leaveMimi(){
  stopRec(true); stopMusic(); stopTalk(); closeMic(); stopVoice();
  let ref = ''; try { ref = document.referrer ? new URL(document.referrer).pathname : ''; } catch (e) {}
  if (ref && ref !== location.pathname && history.length > 1) history.back(); else location.href = 'index.html';
}
$('#mimiBack').addEventListener('click', leaveMimi);

/* touch zones: head = pet, belly = tickle, tail = spin, bell = ring */
$('#mimiBig').addEventListener('click', e => {
  if (mimiBusy()) return;
  const t = e.target;
  if (t.closest('.bell')) { bell(); mood('wow', 900); mimiAnim('jump', 700); spawnNote('🔔'); return; }
  if (t.closest('.tail')) { meow(); mimiAnim('spin', 850); mood('wow', 900); if (rnd(2)) setTimeout(() => sayMimi('mimi_tail'), 400); spawnNote('💫'); return; }
  if (t.closest('#mHead')) { purr(); mood('happy', 1600); mimiAnim('wig', 900); spawnNote('💗', 3); if (++pets % 2 === 1) setTimeout(() => sayMimi('mimi_pet'), 300); return; }
  giggle(); mood('happy', 1100); mimiAnim('jump', 700); spawnNote(pick(['✨', '💜', '💗']), 2);
  if (++tickles % 2 === 1) setTimeout(() => sayMimi(pick(['mimi_tickle1', 'mimi_tickle2'])), 300);
});

/* food */

  if (!micStream || talking || eating) return;
  stopVoice(); stopMusic(); ensureAc();
  let mr; try { mr = new MediaRecorder(micStream); } catch (e) { return; }
  const src = ac.createMediaStreamSource(micStream), an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
  const data = new Float32Array(an.fftSize), chunks = [];
  let heard = false, quiet = 0; const t0 = performance.now();
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    try { src.disconnect(); } catch (e) {}
    const cancelled = rec && rec.cancel; rec = null; setTalkBtn(false); setBubble(''); $('#mimiBig').classList.remove('listen');
    closeMic();
    if (cancelled) return;
    if (heard) playFunny(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })); else sayMimi('mimi_again');
  };
  rec = { mr, cancel: false }; mr.start(); setTalkBtn(true); setBubble('👂 Te escucho…'); $('#mimiBig').classList.add('listen'); mood('wow');
  (function loop(){
    if (!rec || rec.mr !== mr || mr.state !== 'recording') return;
    an.getFloatTimeDomainData(data); let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length), now = performance.now();
    if (rms > .03) { heard = true; quiet = 0; } else if (heard) { quiet = quiet || now; if (now - quiet > 1000) return stopRec(); }
    if (now - t0 > 7000 || (!heard && now - t0 > 6000)) return stopRec();
    requestAnimationFrame(loop);

}
function stopRec(cancel){
  if (!rec) return; if (cancel) rec.cancel = true;
  try { if (rec.mr.state !== 'inactive') rec.mr.stop(); } catch (e) {}
}
function setTalkBtn(on){ const b = $('#talkBtn'); b.classList.toggle('rec', on); b.innerHTML = on ? '<b>👂</b>Te escucho' : '<b>🎤</b>Háblale'; }
$('#talkLabel').addEventListener('click', () => { ensureAc(); stopVoice(); stopMusic(); });
$('#audioIn').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) playFunny(f); });

let talkStop = null;
function stopTalk(){ if (talkStop) { const f = talkStop; talkStop = null; f(); } }
function beginTalk(an, isDone){
  talking = true; setBubble(''); mood(''); const m = $('#mimiBig'), mouth = m.querySelector('.mouth-open');
  m.classList.add('talk'); const data = an ? new Float32Array(an.fftSize) : null; let live = true; const t0 = performance.now();
  (function loop(){
    if (!live) return;
    let v;
    if (an) { an.getFloatTimeDomainData(data); let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i]; v = Math.min(1.25, Math.sqrt(sum / data.length) * 9); }
    else v = .5 + .5 * Math.sin((performance.now() - t0) / 70);
    mouth.style.transform = `scaleY(${v.toFixed(2)})`;
    if (isDone && isDone()) return end();
    requestAnimationFrame(loop);
  })();
  const end = () => { if (!live) return; live = false; talking = false; talkStop = null; m.classList.remove('talk'); mouth.style.transform = ''; mood('happy', 1200); spawnNote('💗', 3); };
  talkStop = end;
  return end;
}
async function playFunny(blob){
  ensureAc(); stopVoice(); stopMusic(); setBubble('🎧 Escuchando…'); mood('wow');
  let buf = null;
  try { buf = await decode(await blob.arrayBuffer()); } catch (e) { buf = null; }
  if (buf && buf.duration > .2) return playBuffer(buf);
  playElement(blob);
}
/* Mimi's funny voice: trim silence, clean and boost the recording, pitch it up with a cartoon wobble,
   add a little "miau" first, then normalize so it plays loud without distorting. */
const FUNNY = { rate: 1.72, wobbleHz: 6.5, wobbleCents: 85 };
function trimRange(buf){
  const ch = buf.getChannelData(0), sr = buf.sampleRate; let peak = 0;
  for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > peak) peak = a; }
  const th = Math.max(.02, peak * .12); let a = 0, b = ch.length - 1;
  while (a < ch.length && Math.abs(ch[a]) < th) a++;
  while (b > a && Math.abs(ch[b]) < th) b--;
  const st = Math.max(0, a / sr - .08), en = Math.min(buf.duration, b / sr + .2);
  return { st, dur: Math.max(.3, Math.min(en - st, 9)), peak: peak || 1 };
}
function meowInto(ctx, dest, t, k){
  const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(560 * k, t); o.frequency.linearRampToValueAtTime(950 * k, t + .14); o.frequency.linearRampToValueAtTime(520 * k, t + .42);
  f.type = 'bandpass'; f.Q.value = 2.5; f.frequency.setValueAtTime(1000, t); f.frequency.linearRampToValueAtTime(2000, t + .15); f.frequency.linearRampToValueAtTime(900, t + .42);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .04); g.gain.setValueAtTime(.42, t + .3); g.gain.exponentialRampToValueAtTime(.001, t + .46);
  o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + .5);
}
async function renderFunny(buf){
  const { st, dur, peak } = trimRange(buf), sr = 44100, lead = .5;
  const len = Math.ceil((lead + dur / FUNNY.rate + .25) * sr);
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new OC(1, len, sr);
  const s = oc.createBufferSource(); s.buffer = buf; s.playbackRate.value = FUNNY.rate;
  try { const lfo = oc.createOscillator(), lg = oc.createGain(); lfo.frequency.value = FUNNY.wobbleHz; lg.gain.value = FUNNY.wobbleCents; lfo.connect(lg); lg.connect(s.detune); lfo.start(0); } catch (e) {}
  const hp = oc.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 160;
  const pres = oc.createBiquadFilter(); pres.type = 'peaking'; pres.frequency.value = 3200; pres.Q.value = .9; pres.gain.value = 6;
  const pre = oc.createGain(); pre.gain.value = Math.min(25, .9 / peak);
  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -26; comp.knee.value = 8; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .18;
  s.connect(hp); hp.connect(pres); pres.connect(pre); pre.connect(comp); comp.connect(oc.destination);
  meowInto(oc, oc.destination, .02, .95 + Math.random() * .2);
  s.start(lead, st, dur);
  const out = await new Promise((res, rej) => { oc.oncomplete = e => res(e.renderedBuffer); const p = oc.startRendering(); if (p && p.then) p.then(res, rej); });
  const d = out.getChannelData(0); let m = 0; for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > m) m = a; }
  if (m > 0) { const k = .98 / m; for (let i = 0; i < d.length; i++) d[i] *= k; }
  return out;
}
async function playBuffer(buf){
  let out = null;
  try { out = await renderFunny(buf); } catch (e) { out = null; }
  const s = ac.createBufferSource(), an = ac.createAnalyser(); an.fftSize = 512;
  if (out) { s.buffer = out; s.connect(an); an.connect(ac.destination); }
  else {
    const { st, dur, peak } = trimRange(buf), g = ac.createGain(), comp = ac.createDynamicsCompressor();
    s.buffer = buf; s.playbackRate.value = FUNNY.rate; g.gain.value = Math.min(25, .9 / peak);
    s.connect(g); g.connect(comp); comp.connect(an); an.connect(ac.destination);
    const end = beginTalk(an); s.onended = end; s.start(0, st, dur);
    talkStop = () => { try { s.stop(); } catch (e) {} end(); };
    return;
  }
  ensureAc();
  const end = beginTalk(an);
  s.onended = end; s.start(0);
  talkStop = () => { try { s.stop(); } catch (e) {} end(); };
}
function playElement(blob){
  const url = URL.createObjectURL(blob), v = document.createElement('audio');
  v.src = url; v.muted = false; v.volume = 1;
  v.preservesPitch = false; v.webkitPreservesPitch = false; v.mozPreservesPitch = false;
  v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0';
  document.body.appendChild(v);
  let an = null;
  try { const src = ac.createMediaElementSource(v), g = ac.createGain(), comp = ac.createDynamicsCompressor(); g.gain.value = 3; an = ac.createAnalyser(); an.fftSize = 512; src.connect(g); g.connect(comp); comp.connect(an); an.connect(ac.destination); } catch (e) { an = null; }
  const cleanup = () => { try { v.pause(); } catch (e) {} v.remove(); URL.revokeObjectURL(url); $('#playBack').hidden = true; };
  const go = () => {
    $('#playBack').hidden = true; v.playbackRate = 1.6;
    const p = v.play();
    const started = () => { const end = beginTalk(an, () => v.ended || v.paused || v.currentTime > 9); talkStop = () => { end(); cleanup(); }; v.onended = () => { end(); cleanup(); }; };
    if (p && p.then) p.then(started, () => { setBubble('▶️ Toca para escuchar'); $('#playBack').hidden = false; $('#playBack').onclick = go; });
    else started();
  };
  v.onerror = () => { cleanup(); setBubble(''); mood(''); sayMimi('mimi_again'); };
  if (v.readyState >= 1) go(); else v.onloadedmetadata = go;
}

/* dance party */
$('#danceBtn').addEventListener('click', () => {
  if (mimiBusy()) return;
  if (musicBus) { stopMusic(); return; }
  ensureAc();
  $('#mimiBig').classList.add('dance'); $('#room').classList.add('party'); mood('happy');
  sayMimi('mimi_dance');
  try { musicBus = ac.createGain(); musicBus.gain.value = 1; musicBus.connect(ac.destination); } catch (e) { musicBus = { disconnect(){} }; }
  const mel = [523, 659, 784, 659, 880, 784, 659, 523, 587, 698, 880, 698, 988, 880, 784, 659], bass = [131, 131, 175, 196];
  for (let i = 0; i < 48; i++) {
    tone(mel[i % 16], .7 + i * .22, .2, 'triangle', .08, musicBus.connect ? musicBus : undefined);
    if (i % 2 === 0) tone(bass[Math.floor(i / 8) % 4], .7 + i * .22, .18, 'sine', .14, musicBus.connect ? musicBus : undefined);
    if (i % 4 === 0) tone(2400, .7 + i * .22, .03, 'square', .02, musicBus.connect ? musicBus : undefined);
  }
  musicBus._iv = setInterval(() => spawnNote(pick(['🎵', '🎶', '✨', '💖', '⭐'])), 380);
  musicBus._to = setTimeout(stopMusic, 11400);
});
function stopMusic(){
  $('#mimiBig').classList.remove('dance'); $('#room').classList.remove('party');
  if (!musicBus) return;
  clearInterval(musicBus._iv); clearTimeout(musicBus._to);
  try { musicBus.disconnect(); } catch (e) {}
  musicBus = null; mood('', 0);
}

/* tail swish now and then instead of non-stop */
setInterval(() => { if (document.hidden || mimiBusy() || $('#mimiBig').classList.contains('sleep')) return; const m = $('#mimiBig'); m.classList.add('wag'); setTimeout(() => m.classList.remove('wag'), 1700); }, 5200);

addEventListener('pagehide', () => { stopRec(true); stopMusic(); closeMic(); });
applyMimiLook(); setMicMode(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)); $('#mimiBig').classList.add('sleep'); spawnNote('💤');

if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
